<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
</head>
<style>
    ul{
        display: flex;
        background-color: rgb(204, 187, 88);
        height: 150px;
        
    }
    li{
        width: 200px;
        height: 60px;
        background-color: blueviolet;
        list-style: none;
        margin-top: 40px;
        margin-right: 60px;
        border-radius: 30px;
        text-align: center;
        line-height: 58px;
    }
    li:hover{
        transform: scale(1.3);
        background-color: rgb(138, 165, 42);
        color: blue;
    }
</style>
<body>
    <nav>
        <ul>
            <li>giorgi</li>
            <li>saba</li>
            <li>giorgi111</li>
        </ul>
    </nav>
</body>
</html>
