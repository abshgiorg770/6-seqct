    <h1 align="center"><font size="5">ეწვიეთ ზუგდიდს</h1></font>
    <img src="../zugdidi/image/ezo.jpg" align="left">
    <p align="right">პროფესიონალური კარიერა 2017 წელს თბილისის „დინამოში“ დაიწყო,
        რომლის შემადგენლობაშიც პირველად იმავე წლის 29 სექტემბერს ეროვნული ლიგის 28-ე
        ტურის შეხვედრაში გამოვიდა მინდორზე. მატჩი, რომელშიც ერთმანეთს თბილისის „დინამო“
        და „კოლხეთი-1913“ დაუპირისპირდნენ, ეროსი მანჯგალაძის სტადიონზე გაიმართა და ფრედ 1-1
        დამთავრდა. ხვიჩა მოედანზე 18 ნომრით შემოვიდა, როდესაც შეხვედრის 62-ე წუთზე აკაკი
        შულაია შეცვალა და თავის ანგარიშზე საგოლე გადაცემაც მიითვალა — 83-ე წუთზე მისი პასით ბექავთარაძემ ანგარიში გაათანაბრა და „დინამო“ დამარცხებისგან იხსნა.
        ეროვნული ლიგის 2017 წლის სეზონში დინამოელთა ძირითად შემადგენლობაში ხვიჩამ სულ ოთხჯერ ითამაშა, 
        ოთხივეჯერ შეცვლაზე შემოვიდა და ერთი გოლი შეაგდო.
        თავის სადებიუტო სეზონში მოედანზე საერთო ჯამში 95 წუთი გაატარა.
        მისი მონაწილეობით გამართული ოთხი შეხვედრიდან თბილისელებმა ორი მოიგეს და ორიც ფრედ დაამთავრეს. 
        მომდევნო წელს „რუსთავში“ გადავიდა, რომლის მაისურითაც 18 შეხვედრა ჩაატარა და სამი ბურთი გაიტანა.</p>
<hr></hr>   
<p>ხვიჩა კვარაცხელია (დ. 12 თებერვალი, 2001, თბილისი, საქართველო) — 
    ქართველი ფეხბურთელი. საქართველოს ეროვნული ნაკრებისა და საფეხბურთო
    კლუბ „პარი სენ-ჟერმენის“ შემტევი ნახევარმცველი.2024 წლის ევროპის
    ჩემპიონატის მონაწილე საქართველოს ეროვნული ნაკრების შემადგენლობაში.</p>
